name: CrossCheck

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, v5, v6, v7]

permissions: {}

jobs:
  crosscheck:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Advisory only: warns when a pull request introduces a lockfile or
      # package-manager contradiction (e.g. a package-lock.json next to
      # bun.lock). Reads config files only; no secrets, no network calls of its
      # own, never fails the build with fail-on: none.
      - name: CrossCheck
        uses: zFinia/crosscheck@bb8ae90b0831b64150e0273086bbe28a8b2f89a4 # main, 2026-09-23
        with:
          fail-on: none
